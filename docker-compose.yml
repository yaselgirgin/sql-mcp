services:
  sql-mcp:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SQL_SERVER=${SQL_SERVER}
      - SQL_PORT=${SQL_PORT:-1433}
      - SQL_DATABASE=${SQL_DATABASE}
      - SQL_USER=${SQL_USER}
      - SQL_PASSWORD=${SQL_PASSWORD}
      - SQL_ENCRYPT=${SQL_ENCRYPT:-false}
      - SQL_TRUST_SERVER_CERTIFICATE=${SQL_TRUST_SERVER_CERTIFICATE:-false}
